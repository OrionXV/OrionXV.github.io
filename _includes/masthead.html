<div class="masthead">
  <div class="masthead__inner-wrap sunset-nav">
    <a class="site-name" href="{{ '/' | relative_url }}"><span class="sun-mark" aria-hidden="true"></span>Arsalaan Nadim</a>
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-links">Menu <span aria-hidden="true">☰</span></button>
    <nav aria-label="Main navigation" id="site-links">
      <ul class="site-links">
        {% for link in site.data.navigation.main %}
        <li><a href="{{ link.url | relative_url }}"{% if page.url == link.url or link.url == '/projects/' and page.collection == 'portfolio' %} aria-current="page"{% endif %}>{{ link.title }}</a></li>
        {% endfor %}
      </ul>
    </nav>
  </div>
</div>

<div class="profile" itemscope itemtype="https://schema.org/Person">
  {% if site.author.avatar %}<img class="profile-avatar" src="{{ site.author.avatar | relative_url }}" alt="Arsalaan smiling and hugging a large pink plush bear in a store" width="150" height="150" itemprop="image">{% endif %}
  <div class="author__content">
    <h2 class="author__name" itemprop="name">Syed Arsalaan<br> Nadim</h2>
    <p class="author__bio">{{ site.author.bio }}<br><span class="profile-institution">{{ site.author.employer }}</span></p>
    <p class="profile-location">{{ site.author.location }}</p>
  </div>
  <ul class="profile-links" id="contact" aria-label="Contact and profiles">
    <li><a href="mailto:{{ site.author.email }}"><span class="fa-solid fa-envelope" aria-hidden="true"></span> Email</a></li>
    <li><a href="https://github.com/{{ site.author.github }}"><span class="fa-brands fa-github" aria-hidden="true"></span> GitHub</a></li>
    <li><a href="https://www.linkedin.com/in/{{ site.author.linkedin }}/"><span class="fa-brands fa-linkedin" aria-hidden="true"></span> LinkedIn</a></li>
  </ul>
  <p class="profile-note">Causal discovery and representation learning.<br>Sequential decision-making. Agentic systems.</p>
</div>
